<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8b6fc4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/app.css">
  <title>塑形打卡</title>
</head>
<body>

<!-- 顶部标题栏 -->
<header class="topbar">
  <div class="topbar-title" id="pageTitle">今日</div>
  <div class="topbar-date" id="topDate"></div>
</header>

<!-- 页面容器 -->
<main id="app">
  <!-- 1. 今日 -->
  <section class="page active" id="page-home"></section>
  <!-- 2. 运动打卡 -->
  <section class="page" id="page-workout"></section>
  <!-- 3. 身体数据 -->
  <section class="page" id="page-body"></section>
  <!-- 4. 打卡中心 -->
  <section class="page" id="page-habit"></section>
  <!-- 5. 我的 -->
  <section class="page" id="page-mine"></section>
</main>

<!-- 底部导航 -->
<nav class="tabbar" id="tabbar">
  <button class="tab active" data-page="home">
    <span class="tab-icon">🏠</span><span class="tab-label">今日</span>
  </button>
  <button class="tab" data-page="workout">
    <span class="tab-icon">🏋️</span><span class="tab-label">运动</span>
  </button>
  <button class="tab" data-page="body">
    <span class="tab-icon">📊</span><span class="tab-label">身体</span>
  </button>
  <button class="tab" data-page="habit">
    <span class="tab-icon">✅</span><span class="tab-label">打卡</span>
  </button>
  <button class="tab" data-page="mine">
    <span class="tab-icon">👤</span><span class="tab-label">我的</span>
  </button>
</nav>

<!-- 弹层容器 -->
<div id="modalRoot"></div>
<!-- 轻提示 -->
<div id="toast" class="toast"></div>

<script src="./js/store.js"></script>
<script src="./js/lib.js"></script>
<script src="./js/anatomy.js"></script>
<script src="./js/app.js"></script>
<script src="./js/pages.js"></script>
<script>
  // 所有脚本加载完成后再初始化（确保 pages.js 已挂载各页渲染函数）
  if (window.__appInit) window.__appInit();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (e) {
        console.log('SW 注册失败', e);
      });
    });
  }
</script>
</body>
</html>
